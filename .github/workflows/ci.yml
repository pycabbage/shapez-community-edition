name: CI

on:
    push:
        branches:
            - master
            - fork/base
            - ModdedGamers-GH-Actions
    pull_request:
        branches:
            - master
            - fork/base

jobs:
    yaml-lint:
        name: yaml-lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: YAML Lint
              uses: ibiqlik/action-yamllint@v3
              with:
                  file_or_dir: translations/*.yaml
